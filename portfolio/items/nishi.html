<div class="setumei" style="font-family: 'MS 明朝', sans-serif;"><p>

    唐澤は札幌西高等学校の74期生である。
2026年１月、成人の集いに先立ち同期の
同窓会が開かれた。その集会の冊子デザイ
ンと、ロゴマーク、そして集会のテーマの
タイポグラフィを担当した。同窓会のテー
マは『あいつ今なにしてる？タテ・ヨコ・
ナナメ』だ。<br>
卒業して四方八方に一度バラバラになっ
た私たちが、再び同じ座標に重なり合う
喜び、さらにこの会が同期の枠を超えて
様々な時間軸にいる西高生同士を繋ぐ
きっかけになってほしいという意味が込
められている。この思いをデザインに踏
襲した。

</p></div>
